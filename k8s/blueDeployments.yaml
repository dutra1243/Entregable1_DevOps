apiVersion: apps/v1
kind: Deployment
metadata:
  name: movies-blue
  labels:
    slot: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movies
      slot: blue
  template:
    metadata:
      labels:
        app: movies
        slot: blue
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
      - name: movies-storage
        hostPath:
          path: /mnt/movies
          type: DirectoryOrCreate
      containers:
      - name: movies
        image: movies/app:blue
        imagePullPolicy: IfNotPresent
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        env:
        - name: SLOT
          value: "blue"
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PORT
        - name: USERS_FILE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: USERS_FILE
        - name: BLACKLIST_FILE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: BLACKLIST_FILE
        - name: FAVORITES_FILE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: FAVORITES_FILE
        - name: MOVIES_FILE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MOVIES_FILE
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: movies-storage
          mountPath: /app/data
