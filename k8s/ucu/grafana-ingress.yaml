apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: obligatorio-grupolegionarios
spec:
  ingressClassName: apisix
  rules:
  - host: grafana-obligatorio-legionarios.reto-ucu.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
